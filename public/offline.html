<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0e27" />
    <title>ZyraFit — Offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        background: #0a0e27; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
      main { max-width: 320px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 20px 0 8px; font-size: 22px; }
      p { margin: 0 0 24px; line-height: 1.5; color: #b8bcd0; font-size: 15px; }
      button { height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #fff; color: #0a0e27;
        font-size: 16px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>ZyraFit needs a connection to sign you in and scan food. Your food log on this device is safe. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
